<style>
:root{--bg:#f7faf8;--surface:#fff;--ink:#12261f;--muted:#5b6b64;--brand:#0e4f3f;--on-brand:#fff;--soft:#e4f1ec;--gold:#f0b429;--gold-ink:#2b1d00;--line:#d9e5df;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1713;--surface:#14241d;--ink:#e8f2ed;--muted:#9bb0a6;--brand:#46c9a1;--on-brand:#06201a;--soft:#1a2e26;--line:#26392f}}
:root[data-theme="dark"]{--bg:#0c1713;--surface:#14241d;--ink:#e8f2ed;--muted:#9bb0a6;--brand:#46c9a1;--on-brand:#06201a;--soft:#1a2e26;--line:#26392f}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
html[lang=en]{--lh:1.6;--hl:1.2;--ff:'Nunito',system-ui,sans-serif}
html[lang=ur]{--lh:2;--hl:2.1;--ff:'Noto Nastaliq Urdu','Nunito',system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/var(--lh) var(--ff);-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--brand);text-decoration:none}
.brand svg{width:38px;height:38px;flex:none}
.btn{font:700 1.1rem/1.6 var(--ff);border:0;border-radius:14px;padding:12px 30px;min-height:48px;cursor:pointer;background:var(--gold);color:var(--gold-ink);box-shadow:0 4px 0 rgba(0,0,0,.16)}
.btn:active{transform:translateY(2px)}
.btn.ghost{background:transparent;color:var(--brand);box-shadow:none;border:2px solid var(--brand);font-size:.9rem;padding:4px 16px;min-height:40px}
.btn.sm{font-size:.95rem;padding:6px 20px;min-height:42px;background:var(--brand);color:var(--on-brand);box-shadow:none}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding:28px 0 40px}
h1{font-size:clamp(1.6rem,4.6vw,2.6rem);line-height:var(--hl);margin:0 0 10px;color:var(--brand)}
h2{font-size:1.4rem;line-height:var(--hl);margin:0 0 4px;color:var(--brand)}
.lead,.sub{color:var(--muted);margin:0 0 20px;font-size:1rem}
.pts{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:18px;color:var(--muted);font-size:.85rem}
.art{background:var(--soft);border-radius:28px;aspect-ratio:1/1;display:grid;place-items:center}
.art svg{width:78%;height:auto}
section{padding:30px 0;border-top:1px solid var(--line)}
.rows{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 28px}
.row{display:flex;gap:14px;align-items:center}
.ic{flex:none;width:54px;height:54px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:1.6rem;line-height:1}
.row b{display:block}.row span{color:var(--muted);font-size:.88rem;display:block}
.scroller{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}
.tile{flex:none;width:170px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.tile i{display:grid;place-items:center;height:104px;font-style:normal;font-size:2.4rem;background:linear-gradient(135deg,var(--soft),var(--line))}
.tile p{margin:0;padding:6px 12px;font-size:.92rem}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:18px;padding:18px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.tab{border:2px solid var(--brand);background:transparent;color:var(--brand);border-radius:999px;padding:3px 20px;font:700 .95rem/1.8 var(--ff);cursor:pointer;min-height:42px}
.tab[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.tool{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;align-items:start}
.tool[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
label{display:block;font-weight:700;font-size:.88rem;margin:8px 0 2px}
input:not([type=checkbox]):not([type=range]),select,textarea{width:100%;font-size:.95rem;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);line-height:1.5}
textarea{min-height:64px;resize:vertical}
.two{display:flex;gap:10px}.two>*{flex:1}
#cvbox{overflow:hidden;min-width:0;border-radius:6px}#cvscale{width:794px;transform-origin:top left}
#cv{width:794px;background:#fff;color:#1b1b1b;box-shadow:0 0 0 1px var(--line);padding:30px;font:15px/1.55 'Nunito',sans-serif;direction:ltr;text-align:left;overflow-wrap:anywhere;min-height:1120px;display:flex;flex-direction:column}#cv .cvm{flex:1}#cv li{margin:4px 0}#cv .chips.col span{display:table;border-radius:14px}#cv.t5 .chips.col span{display:block}#cv.t5 .chips.col span::after{content:none!important}
#cv h1{font:800 36px/1.2 'Nunito',sans-serif;margin:0;color:#12261f}
#cv .cvh{display:flex;align-items:center;gap:16px;margin-bottom:14px}
#cv .cvh img{width:104px;height:104px;border-radius:50%;object-fit:cover}
#cv .cvh p{margin:2px 0 0;color:#0e4f3f;font-weight:700}
#cv h4{margin:20px 0 6px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#0e4f3f;border-bottom:2px solid #0e4f3f;padding-bottom:2px}
#cv ul{margin:4px 0;padding-left:20px}#cv p{margin:4px 0}
#cv .chips span{display:inline-block;background:#e4f1ec;color:#0e4f3f;border-radius:999px;padding:2px 13px;margin:3px 5px 3px 0;font-size:13px}
#cv.t1 .cvh{flex-direction:column;text-align:center;border-bottom:3px double #0e4f3f;padding-bottom:12px}
#cv.t2 .cvh{background:#0e4f3f;margin:-30px -30px 18px;padding:26px 30px}
#cv.t2 .cvh h1{color:#fff}#cv.t2 .cvh p{color:#f0b429}
#cv.t3 .cvm{display:grid;grid-template-columns:34% 1fr;gap:18px}
#cv.t3 aside{background:#0e4f3f;color:#fff;padding:12px 14px;border-radius:8px}
#cv.t3 aside h4{color:#f0b429;border-color:#f0b429}#cv.t3 aside .chips span{background:rgba(255,255,255,.16);color:#fff}
#cv.t4 .cvm,#cv.t6 .cvm,#cv.t8 .cvm{display:grid;grid-template-columns:34% 1fr;gap:18px}
#cv.t4 .cvh{background:#0f2742;margin:-30px -30px 18px;padding:24px 26px;border-bottom:4px solid #c9a227}
#cv.t4 .cvh h1{color:#fff;letter-spacing:.04em}#cv.t4 .cvh p{color:#e5c76b;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
#cv.t4 .cvh img{border:3px solid #c9a227}#cv.t4 aside{background:#eef2f7;padding:12px 14px;border-radius:6px}
#cv.t4 h4{color:#0f2742;border-color:#c9a227}#cv.t4 .chips span{background:#0f2742;color:#fff}
#cv.t5{font-family:Georgia,'Times New Roman',serif;padding:34px 38px}
#cv.t5 .cvh{flex-direction:column;text-align:center;border-bottom:1px solid #222;padding-bottom:12px}
#cv.t5 .cvh h1{font:400 30px/1.2 Georgia,serif;letter-spacing:.2em;text-transform:uppercase}
#cv.t5 .cvh p{color:#555;font-weight:400;letter-spacing:.2em;text-transform:uppercase;font-size:12px}
#cv.t5 h4{color:#111;border-bottom:1px solid #999;font-weight:400;letter-spacing:.2em}
#cv.t5 .chips span{background:none;color:#222;padding:0;margin:0 4px 0 0;border-radius:0;font-size:13px}
#cv.t5 .chips span:not(:last-child)::after{content:" \00B7";margin-left:4px}
#cv.t5 .cvm{display:grid;grid-template-columns:30% 1fr;gap:22px}
#cv.t6 .cvh{background:linear-gradient(120deg,#0d9488,#22c55e);margin:-30px -30px 18px;padding:26px;border-radius:6px 6px 0 0}
#cv.t6 .cvh h1{color:#fff}#cv.t6 .cvh p{color:#ecfdf5}
#cv.t6 .cvh img{border:4px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}#cv.t6 aside{background:#f0fdfa;padding:12px 14px;border-radius:10px}
#cv.t6 h4{border:0;border-left:5px solid #0d9488;padding-left:8px;color:#0f766e}#cv.t6 .chips span{background:#ccfbf1;color:#0f766e}
#cv.t7 .cvh{border-left:6px solid #7c3aed;padding-left:14px}
#cv.t7 .cvh h1{color:#4c1d95}#cv.t7 .cvh p{color:#7c3aed}#cv.t7 h4{color:#4c1d95;border-color:#ddd6fe}
#cv.t7 main ul{list-style:none;padding-left:16px;border-left:2px solid #ddd6fe;margin-left:4px}
#cv.t7 main li{position:relative;margin:6px 0}
#cv.t7 main li::before{content:"";position:absolute;left:-23px;top:7px;width:10px;height:10px;border-radius:50%;background:#7c3aed}
#cv.t7 .chips span{background:#ede9fe;color:#4c1d95}
#cv.t8 .cvh{border-bottom:3px solid #1d4ed8;padding-bottom:12px}
#cv.t8 .cvh h1{color:#1e3a8a;text-transform:uppercase;letter-spacing:.05em}#cv.t8 .cvh p{color:#1d4ed8}
#cv.t8 aside{border-right:1px solid #cbd5e1;padding-right:14px}
#cv.t8 h4{color:#fff;background:#1d4ed8;border:0;padding:3px 10px;border-radius:3px}#cv.t8 .chips span{background:#dbeafe;color:#1e3a8a}
#out img{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-top:10px}
.note{font-size:.8rem;color:var(--muted)}
.about{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.aph{width:150px;height:150px;border-radius:50%;background:var(--soft);border:4px solid var(--brand);display:grid;place-items:center;font-size:3.4rem;overflow:hidden;flex:none}
.aph img{width:100%;height:100%;object-fit:cover}
.about h3{margin:0;font-size:1.3rem}.abr{margin:0;color:var(--brand);font-weight:700}
.thanks{margin-top:26px;background:var(--brand);color:var(--on-brand);border-radius:22px;padding:24px 26px;text-align:center}.thanks h2{color:inherit}
.wallnote{margin-top:14px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--soft);border-radius:16px;padding:14px 18px}.wallnote p{margin:0;flex:1 1 260px}.wa3{text-decoration:none;display:inline-block}
.dsl{direction:ltr;overflow:hidden;border-radius:16px;background:var(--soft);padding:10px 0}
.dtrack{display:flex;gap:12px;width:max-content;animation:dslide 34s linear infinite}
.dtrack.still{animation:none;margin:0 auto}
.dsl:hover .dtrack{animation-play-state:paused}
@keyframes dslide{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.dtrack{animation:none}.dsl{overflow-x:auto}}
.dc{position:relative;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 16px 8px 8px;min-width:210px}
.dc img,.dc .av{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none}
.dc img{cursor:pointer}.dc .av{display:grid;place-items:center;background:var(--soft);font-size:1.4rem}
.dc b,.dc span{display:block;unicode-bidi:plaintext;line-height:1.5}.dc b{font-size:.95rem}.dc span{font-size:.8rem;color:var(--muted)}
.ddel{position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border:0;border-radius:999px;min-width:24px;height:24px;font-size:.7rem;cursor:pointer}
.ggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:720px){.ggrid{grid-template-columns:repeat(4,1fr)}}
.gt{position:relative;display:block;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:18px;overflow:hidden;padding:0;cursor:pointer;text-align:start;color:inherit;font:inherit}
.gt .c0{aspect-ratio:1/1;display:grid;place-items:center;font-size:2.6rem;background:linear-gradient(135deg,var(--soft),var(--line))}
.gt img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.gt p{margin:0;padding:4px 12px;font-weight:700;font-size:.95rem}
.badge{position:absolute;top:8px;inset-inline-start:8px;background:rgba(10,40,30,.85);color:#fde68a;border-radius:999px;padding:0 10px;font:700 12px/1.8 'Nunito',sans-serif}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:55vh;overflow-y:auto;padding:4px 0}
.gi{position:relative}.gi img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;cursor:pointer;display:block}
.gdel{position:absolute;top:4px;inset-inline-end:4px;background:#dc2626;color:#fff;border:0;border-radius:999px;min-width:30px;height:30px;cursor:pointer}
#gdlg{width:min(560px,94vw)}#lb{width:min(900px,96vw);background:transparent;box-shadow:none;padding:0}
#lb img{width:100%;max-height:80vh;object-fit:contain;border-radius:12px;background:#000;display:block}
footer{padding:26px 0 90px;text-align:center;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
.mbar{display:none}
dialog{border:0;border-radius:22px;padding:0;width:min(460px,92vw);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{padding:22px}
.chips2{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chip{border:2px solid var(--brand);background:transparent;color:var(--brand);border-radius:999px;padding:2px 18px;font:700 .95rem/1.9 'Nunito',sans-serif;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.acct{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-radius:14px;padding:6px 14px;margin:8px 0;line-height:1.6}
.acct small{display:block;color:var(--muted);font-size:.78rem}
.acct strong{font-family:'Nunito',sans-serif;overflow-wrap:anywhere}
.acct button{border:1px solid var(--brand);background:transparent;color:var(--brand);border-radius:10px;padding:2px 14px;font:700 .8rem 'Nunito',sans-serif;cursor:pointer;min-height:34px}
.wa{display:block;text-align:center;text-decoration:none;margin-top:12px}
@media (max-width:720px){
.hero{grid-template-columns:1fr;padding-top:10px}.art{aspect-ratio:16/10}.art svg{width:46%}
.rows{grid-template-columns:1fr}
.mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.mbar .btn{width:100%}

}
#printwrap{display:none}
@media print{@page{size:A4;margin:0}html,body{margin:0!important;padding:0!important;background:#fff!important}body.printing>*:not(#printwrap){display:none!important}#printwrap{display:block}#printwrap #cv{width:210mm;min-height:296mm;margin:0;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
